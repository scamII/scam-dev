name: Apply audit remediation

on:
  push:
    branches:
      - fix/full-audit-remediation-2026-07-10

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/full-audit-remediation-2026-07-10
          fetch-depth: 0

      - name: Apply and verify remediation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .remediation/chunk-* | base64 --decode > /tmp/remediation.tar.gz
          echo "b860942024ddaa4fb3d47958ea102bf8167e43272ac47fd86afe279898e7fb3a  /tmp/remediation.tar.gz" | sha256sum -c -
          tar -xzf /tmp/remediation.tar.gz -C .
          rm -rf .remediation
          rm -f .github/workflows/apply-remediation.yml
          rm -f assets/js/app.js assets/js/main.js
          rm -f assets/js/components/BurgerMenu.jsx assets/js/components/RelatedPosts.jsx
          rm -f scam-dev-full-audit-report-ru-utf8-bom.md
          chmod +x scripts/*.sh scripts/sign-update-manifest.php || true
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          node scripts/static-check.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remediate repository audit findings"
          git push origin HEAD:fix/full-audit-remediation-2026-07-10
